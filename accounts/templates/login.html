{% extends 'base.html' %}
{% block title %}Login — {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section-py">
    <div class="container" style="max-width:460px;">
        <div class="card-hover card-body-sh p-4">
            <div class="section-eyebrow">Welcome Back</div>
            <h3 class="mb-4">Login</h3>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-orange w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0 small">New here? <a href="{% url 'register' %}">Create an account</a></p>
        </div>
    </div>
</section>
{% endblock %}
